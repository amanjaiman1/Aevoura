<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Soft clay and blush forms dissolving into one another behind the fine contour of a serum droplet.">
  <!-- VELORA / WORK 004 — placeholder poster.
       Replace with an exported frame of the live build (.avif or .webp, 1600x1000). -->
  <defs>
    <linearGradient id="v-ground" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#eeddd0"/>
      <stop offset="60%" stop-color="#e3d3c6"/>
      <stop offset="100%" stop-color="#d3bcab"/>
    </linearGradient>
    <radialGradient id="v-clay" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c98a68"/>
      <stop offset="100%" stop-color="#9d5a3f"/>
    </radialGradient>
    <radialGradient id="v-blush" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f6e0d2"/>
      <stop offset="100%" stop-color="#e0b79f"/>
    </radialGradient>
    <radialGradient id="v-resin" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#e8c9a4"/>
      <stop offset="100%" stop-color="#b98055"/>
    </radialGradient>
    <linearGradient id="v-drop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fdf4ec" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#efd8c6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#b98055" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="v-blur-lg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
    <filter id="v-blur-md" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="v-blur-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="v-clip"><rect width="1600" height="1000"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#v-ground)"/>

  <g clip-path="url(#v-clip)">
    <!-- dissolving organic masses -->
    <g filter="url(#v-blur-lg)">
      <ellipse cx="420" cy="330" rx="330" ry="290" fill="url(#v-clay)" opacity="0.62"/>
      <ellipse cx="1180" cy="700" rx="380" ry="300" fill="url(#v-resin)" opacity="0.55"/>
      <ellipse cx="1080" cy="220" rx="280" ry="210" fill="url(#v-blush)" opacity="0.75"/>
      <ellipse cx="300" cy="850" rx="300" ry="200" fill="#c98a68" opacity="0.4"/>
    </g>
    <g filter="url(#v-blur-md)">
      <ellipse cx="700" cy="520" rx="240" ry="220" fill="#f2ddcc" opacity="0.55"/>
      <ellipse cx="980" cy="480" rx="150" ry="180" fill="#9d5a3f" opacity="0.24"/>
    </g>

    <!-- a single oil sheen -->
    <g filter="url(#v-blur-sm)" opacity="0.4">
      <path d="M180 620 C400 540 560 700 820 610 C1060 528 1240 640 1500 560" fill="none" stroke="#fdf4ec" stroke-width="5"/>
    </g>

    <!-- ── the droplet: the only hard contour in the frame ── -->
    <g transform="translate(800 500)">
      <path d="M0 -196 C64 -104 150 -34 150 56 C150 148 82 208 0 208 C-82 208 -150 148 -150 56 C-150 -34 -64 -104 0 -196 Z"
            fill="url(#v-drop)"/>
      <path d="M0 -196 C64 -104 150 -34 150 56 C150 148 82 208 0 208 C-82 208 -150 148 -150 56 C-150 -34 -64 -104 0 -196 Z"
            fill="none" stroke="#5c3524" stroke-width="1.5" opacity="0.55"/>
      <!-- inner meniscus -->
      <path d="M-104 92 C-58 142 58 142 104 92" fill="none" stroke="#5c3524" stroke-width="1" opacity="0.3"/>
      <!-- specular -->
      <ellipse cx="-52" cy="26" rx="26" ry="44" fill="#fffaf5" opacity="0.75" transform="rotate(-18 -52 26)"/>
      <ellipse cx="54" cy="128" rx="14" ry="9" fill="#fffaf5" opacity="0.4"/>
    </g>

    <!-- fine botanical contour, cropped by the edge -->
    <g fill="none" stroke="#5c3524" stroke-width="1.25" opacity="0.3">
      <path d="M1600 300 C1440 320 1330 400 1290 520 C1380 520 1490 456 1600 388"/>
      <path d="M1600 344 C1470 388 1370 452 1290 520"/>
      <path d="M0 452 C130 470 220 530 250 620 C170 616 74 560 0 512"/>
    </g>

    <!-- measured note rule -->
    <g stroke="#5c3524" opacity="0.35">
      <path d="M72 760 H520" stroke-width="1"/>
      <path d="M72 754 V766"/>
    </g>
  </g>

  <g font-family="ui-monospace, monospace" font-size="14" letter-spacing="3" fill="#3a2419" opacity="0.55">
    <text x="86" y="748">TOP / HEART / BASE</text>
  </g>
</svg>
