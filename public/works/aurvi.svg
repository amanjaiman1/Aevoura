<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="A faceted solitaire diamond catching light against a near-black studio ground.">
  <!-- AURVI / WORK 001 — placeholder poster.
       Replace with an exported frame of the live build (.avif or .webp, 1600x1000). -->
  <defs>
    <radialGradient id="a-glow" cx="50%" cy="47%" r="42%">
      <stop offset="0%" stop-color="#584a2e" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#241d12" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0b0a09" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a-vig" cx="50%" cy="45%" r="72%">
      <stop offset="55%" stop-color="#0b0a09" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.82"/>
    </radialGradient>
    <linearGradient id="a-floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c98a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8c98a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8c98a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="a-caustic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e6bd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f6e6bd" stop-opacity="0"/>
    </linearGradient>
    <filter id="a-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="a-soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#0b0a09"/>
  <ellipse cx="800" cy="470" rx="620" ry="430" fill="url(#a-glow)"/>

  <!-- studio floor line -->
  <rect x="180" y="742" width="1240" height="1" fill="url(#a-floor)"/>

  <!-- caustic scatter beneath the stone -->
  <g filter="url(#a-soft2)" opacity="0.75">
    <path d="M800 706 L742 742 L764 742 Z" fill="url(#a-caustic)"/>
    <path d="M800 706 L858 742 L836 742 Z" fill="url(#a-caustic)"/>
    <path d="M800 706 L800 742 L812 742 Z" fill="url(#a-caustic)"/>
    <path d="M800 706 L668 742 L692 742 Z" fill="url(#a-caustic)" opacity="0.6"/>
    <path d="M800 706 L932 742 L908 742 Z" fill="url(#a-caustic)" opacity="0.6"/>
  </g>
  <ellipse cx="800" cy="742" rx="210" ry="9" fill="#e8c98a" opacity="0.16" filter="url(#a-soft2)"/>

  <!-- halo -->
  <ellipse cx="800" cy="500" rx="230" ry="220" fill="#8a713f" opacity="0.3" filter="url(#a-soft)"/>

  <!-- ── the stone: brilliant cut, front elevation ── -->
  <g>
    <!-- crown -->
    <polygon points="648,470 700,470 730,372" fill="#6b6153"/>
    <polygon points="700,470 752,470 765,372 730,372" fill="#cfc0a0"/>
    <polygon points="752,470 800,470 800,372 765,372" fill="#f4ebd6"/>
    <polygon points="800,470 848,470 835,372 800,372" fill="#d6c9a9"/>
    <polygon points="848,470 900,470 870,372 835,372" fill="#8a7f6c"/>
    <polygon points="900,470 952,470 870,372" fill="#585045"/>

    <!-- table highlight -->
    <rect x="730" y="368" width="140" height="5" fill="#fdf7e6" opacity="0.9"/>

    <!-- girdle -->
    <rect x="648" y="466" width="304" height="8" fill="#1b1712"/>
    <rect x="648" y="466" width="304" height="2" fill="#f2e3bd" opacity="0.55"/>

    <!-- pavilion -->
    <polygon points="648,474 700,474 800,706" fill="#332e25"/>
    <polygon points="700,474 752,474 800,706" fill="#7d715c"/>
    <polygon points="752,474 800,474 800,706" fill="#bdad8d"/>
    <polygon points="800,474 848,474 800,706" fill="#8f8368"/>
    <polygon points="848,474 900,474 800,706" fill="#4a4335"/>
    <polygon points="900,474 952,474 800,706" fill="#2a261f"/>

    <!-- facet hairlines -->
    <g stroke="#f6ecd2" stroke-width="1" opacity="0.22" fill="none">
      <path d="M700 470 L730 372 M752 470 L765 372 M800 470 L800 372 M848 470 L835 372 M900 470 L870 372"/>
      <path d="M700 474 L800 706 M752 474 L800 706 M848 474 L800 706 M900 474 L800 706"/>
      <path d="M648 470 L730 372 M952 470 L870 372"/>
    </g>

    <!-- single specular glint -->
    <circle cx="770" cy="410" r="7" fill="#fffaf0" opacity="0.95"/>
    <circle cx="770" cy="410" r="20" fill="#fff3d4" opacity="0.28" filter="url(#a-soft2)"/>
  </g>

  <rect width="1600" height="1000" fill="url(#a-vig)"/>

</svg>
