<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="A technical drawing of a brake rotor over measured rules with a vermilion velocity slash.">
  <!-- KINETIC / WORK 002 — placeholder poster.
       Replace with an exported frame of the live build (.avif or .webp, 1600x1000). -->
  <defs>
    <linearGradient id="k-ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#efece6"/>
      <stop offset="100%" stop-color="#ddd9d1"/>
    </linearGradient>
    <linearGradient id="k-slash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8360e" stop-opacity="0"/>
      <stop offset="18%" stop-color="#d8360e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d8360e" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="k-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#121110" stop-opacity="0"/>
      <stop offset="100%" stop-color="#121110" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="k-clip"><rect width="1600" height="1000"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#k-ground)"/>

  <g clip-path="url(#k-clip)">
    <!-- measured velocity rules: spacing tightens toward the right -->
    <g stroke="#121110" opacity="0.2">
      <path d="M0 300 H1600" stroke-width="1"/>
      <path d="M0 700 H1600" stroke-width="1"/>
    </g>
    <g stroke="url(#k-fade)" stroke-width="3">
      <path d="M120 352 H700"/>
      <path d="M120 388 H860"/>
      <path d="M120 424 H620"/>
      <path d="M120 576 H780"/>
      <path d="M120 612 H540"/>
      <path d="M120 648 H900"/>
    </g>

    <!-- tick scale along the top -->
    <g stroke="#121110" opacity="0.45">
      <path d="M0 200 H1600" stroke-width="1" opacity="0.35"/>
      <g stroke-width="1">
        <path d="M120 200 v18 M170 200 v9 M220 200 v9 M270 200 v9 M320 200 v18 M370 200 v9 M420 200 v9 M470 200 v9 M520 200 v18 M570 200 v9 M620 200 v9 M670 200 v9 M720 200 v18 M770 200 v9 M820 200 v9 M870 200 v9 M920 200 v18 M970 200 v9 M1020 200 v9 M1070 200 v9 M1120 200 v18 M1170 200 v9 M1220 200 v9 M1270 200 v9 M1320 200 v18 M1370 200 v9 M1420 200 v9 M1470 200 v18"/>
      </g>
    </g>

    <!-- ── brake rotor, drawn as an engineering section ── -->
    <g transform="translate(1080 500)">
      <circle r="330" fill="none" stroke="#121110" stroke-width="1" opacity="0.22"/>
      <circle r="288" fill="#c9c4bb" opacity="0.55"/>
      <circle r="288" fill="none" stroke="#121110" stroke-width="2" opacity="0.7"/>
      <circle r="236" fill="none" stroke="#121110" stroke-width="1" opacity="0.5"/>
      <circle r="120" fill="#d6d1c8"/>
      <circle r="120" fill="none" stroke="#121110" stroke-width="2" opacity="0.7"/>
      <circle r="42" fill="none" stroke="#121110" stroke-width="1.5" opacity="0.6"/>

      <!-- drilled cooling holes, two rings -->
      <g fill="#121110" opacity="0.55">
        <circle cx="0" cy="-186" r="11"/><circle cx="93" cy="-161" r="11"/><circle cx="161" cy="-93" r="11"/>
        <circle cx="186" cy="0" r="11"/><circle cx="161" cy="93" r="11"/><circle cx="93" cy="161" r="11"/>
        <circle cx="0" cy="186" r="11"/><circle cx="-93" cy="161" r="11"/><circle cx="-161" cy="93" r="11"/>
        <circle cx="-186" cy="0" r="11"/><circle cx="-161" cy="-93" r="11"/><circle cx="-93" cy="-161" r="11"/>
      </g>
      <g fill="#121110" opacity="0.32">
        <circle cx="46" cy="-249" r="8"/><circle cx="133" cy="-215" r="8"/><circle cx="215" cy="-133" r="8"/>
        <circle cx="249" cy="-46" r="8"/><circle cx="249" cy="46" r="8"/><circle cx="215" cy="133" r="8"/>
        <circle cx="133" cy="215" r="8"/><circle cx="46" cy="249" r="8"/><circle cx="-46" cy="249" r="8"/>
        <circle cx="-133" cy="215" r="8"/><circle cx="-215" cy="133" r="8"/><circle cx="-249" cy="46" r="8"/>
        <circle cx="-249" cy="-46" r="8"/><circle cx="-215" cy="-133" r="8"/><circle cx="-133" cy="-215" r="8"/>
        <circle cx="-46" cy="-249" r="8"/>
      </g>

      <!-- hub bolts -->
      <g fill="none" stroke="#121110" stroke-width="1.5" opacity="0.65">
        <circle cx="0" cy="-82" r="13"/><circle cx="78" cy="-25" r="13"/>
        <circle cx="48" cy="66" r="13"/><circle cx="-48" cy="66" r="13"/><circle cx="-78" cy="-25" r="13"/>
      </g>

      <!-- centre cross-hair -->
      <g stroke="#d8360e" stroke-width="1.5">
        <path d="M-64 0 H64 M0 -64 V64"/>
      </g>

      <!-- caliper block -->
      <path d="M-318 -74 h84 a16 16 0 0 1 16 16 v116 a16 16 0 0 1 -16 16 h-84 z" fill="#121110" opacity="0.88"/>
      <path d="M-318 -74 h84 a16 16 0 0 1 16 16 v116 a16 16 0 0 1 -16 16 h-84 z" fill="none" stroke="#121110" stroke-width="1"/>
      <g stroke="#efece6" stroke-width="1" opacity="0.5">
        <path d="M-300 -46 h50 M-300 -16 h50 M-300 14 h50 M-300 44 h50"/>
      </g>
    </g>

    <!-- the velocity slash -->
    <path d="M0 858 L1180 858 L1240 906 L0 906 Z" fill="url(#k-slash)"/>
    <path d="M0 830 L980 830 L1010 848 L0 848 Z" fill="#d8360e" opacity="0.25"/>
  </g>

  <g font-family="ui-monospace, monospace" font-size="15" letter-spacing="3" fill="#121110" opacity="0.45">
    <text x="120" y="262">0—100 / 2.9s</text>
    <text x="420" y="262">TORQUE / 940Nm</text>
    <text x="760" y="262">MASS / 1,412kg</text>
  </g>
</svg>
