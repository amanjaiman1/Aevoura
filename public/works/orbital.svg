<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Concentric orbit rings over a precise node grid, with a single luminous blue point on the outer path.">
  <!-- ORBITAL / WORK 005 — placeholder poster.
       Replace with an exported frame of the live build (.avif or .webp, 1600x1000). -->
  <defs>
    <linearGradient id="o-ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#151922"/>
      <stop offset="100%" stop-color="#0c0e13"/>
    </linearGradient>
    <radialGradient id="o-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfdcff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#5b8cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="o-arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#5b8cff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="o-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="o-glow-lg" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="54"/>
    </filter>
    <clipPath id="o-clip"><rect width="1600" height="1000"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#o-ground)"/>

  <g clip-path="url(#o-clip)">
    <!-- node grid -->
    <g fill="#5b8cff" opacity="0.2">
      <g id="o-row">
        <circle cx="100" cy="100" r="1.6"/><circle cx="200" cy="100" r="1.6"/><circle cx="300" cy="100" r="1.6"/>
        <circle cx="400" cy="100" r="1.6"/><circle cx="500" cy="100" r="1.6"/><circle cx="600" cy="100" r="1.6"/>
        <circle cx="700" cy="100" r="1.6"/><circle cx="800" cy="100" r="1.6"/><circle cx="900" cy="100" r="1.6"/>
        <circle cx="1000" cy="100" r="1.6"/><circle cx="1100" cy="100" r="1.6"/><circle cx="1200" cy="100" r="1.6"/>
        <circle cx="1300" cy="100" r="1.6"/><circle cx="1400" cy="100" r="1.6"/><circle cx="1500" cy="100" r="1.6"/>
      </g>
      <use href="#o-row" y="100"/><use href="#o-row" y="200"/><use href="#o-row" y="300"/>
      <use href="#o-row" y="400"/><use href="#o-row" y="500"/><use href="#o-row" y="600"/>
      <use href="#o-row" y="700"/><use href="#o-row" y="800"/>
    </g>

    <!-- graticule -->
    <g stroke="#5b8cff" opacity="0.1" stroke-width="1">
      <path d="M0 500 H1600 M800 0 V1000"/>
    </g>

    <!-- ── the orbit motif: one idea, used consistently ── -->
    <g transform="translate(800 500)">
      <circle r="300" fill="url(#o-core)" opacity="0.5" filter="url(#o-glow-lg)"/>

      <!-- outer orbit -->
      <circle r="392" fill="none" stroke="#5b8cff" stroke-width="1" opacity="0.22"/>
      <circle r="392" fill="none" stroke="url(#o-arc)" stroke-width="2"
              stroke-dasharray="880 1584" transform="rotate(-46)"/>

      <!-- inclined orbits -->
      <ellipse rx="392" ry="128" fill="none" stroke="#5b8cff" stroke-width="1" opacity="0.28" transform="rotate(-22)"/>
      <ellipse rx="300" ry="96" fill="none" stroke="#5b8cff" stroke-width="1" opacity="0.2" transform="rotate(26)"/>
      <circle r="228" fill="none" stroke="#5b8cff" stroke-width="1" opacity="0.3" stroke-dasharray="3 9"/>
      <circle r="132" fill="none" stroke="#5b8cff" stroke-width="1" opacity="0.4"/>

      <!-- core -->
      <circle r="46" fill="#0c0e13" stroke="#5b8cff" stroke-width="1.5" opacity="0.95"/>
      <circle r="9" fill="#e8ecf4"/>
      <circle r="26" fill="#5b8cff" opacity="0.3" filter="url(#o-glow)"/>

      <!-- the single luminous node on the outer path -->
      <g transform="rotate(-46) translate(392 0)">
        <circle r="34" fill="#5b8cff" opacity="0.35" filter="url(#o-glow)"/>
        <circle r="8" fill="#eaf0ff"/>
        <circle r="15" fill="none" stroke="#5b8cff" stroke-width="1" opacity="0.7"/>
      </g>

      <!-- secondary nodes, dim -->
      <g fill="#5b8cff" opacity="0.55">
        <circle cx="-228" cy="0" r="4"/>
        <circle cx="93" cy="93" r="4"/>
      </g>

      <!-- radial ticks -->
      <g stroke="#5b8cff" opacity="0.3" stroke-width="1">
        <path d="M392 0 h18 M-392 0 h-18 M0 -392 v-18 M0 392 v18"/>
      </g>
    </g>

    <!-- labelled leader, documentation-grade -->
    <g stroke="#5b8cff" opacity="0.4" stroke-width="1">
      <path d="M1072 228 L1240 228 L1240 216"/>
      <path d="M528 700 L340 700"/>
    </g>
  </g>

  <g font-family="ui-monospace, monospace" font-size="14" letter-spacing="3" fill="#8fa8e0" opacity="0.7">
    <text x="1252" y="222">NODE 01</text>
    <text x="196" y="694" text-anchor="start">CORE</text>
  </g>
</svg>
