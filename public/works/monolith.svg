<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Hard-edged concrete masses casting long diagonal shadows, overlaid with architectural plan hairlines.">
  <!-- MONOLITH / WORK 003 — placeholder poster.
       Replace with an exported frame of the live build (.avif or .webp, 1600x1000). -->
  <defs>
    <linearGradient id="m-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9d5cc"/>
      <stop offset="100%" stop-color="#c4bfb5"/>
    </linearGradient>
    <linearGradient id="m-litA" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#e6e2d9"/>
      <stop offset="100%" stop-color="#cdc8bd"/>
    </linearGradient>
    <linearGradient id="m-litB" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#dcd7cd"/>
      <stop offset="100%" stop-color="#bcb6ab"/>
    </linearGradient>
    <linearGradient id="m-shadow" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#1c1a17" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1c1a17" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="m-clip"><rect width="1600" height="1000"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#m-sky)"/>

  <g clip-path="url(#m-clip)">
    <!-- ground plane -->
    <path d="M0 760 H1600 V1000 H0 Z" fill="#b3ada2"/>
    <path d="M0 760 H1600" stroke="#1c1a17" stroke-width="1" opacity="0.35"/>

    <!-- cast shadows, raking left -->
    <path d="M300 760 L52 1000 H430 L520 760 Z" fill="url(#m-shadow)"/>
    <path d="M760 760 L560 1000 H900 L960 760 Z" fill="url(#m-shadow)" opacity="0.8"/>
    <path d="M1180 760 L1010 1000 H1340 L1380 760 Z" fill="url(#m-shadow)" opacity="0.65"/>

    <!-- mass A: tall slab -->
    <path d="M300 168 H520 V760 H300 Z" fill="url(#m-litA)"/>
    <path d="M520 168 H596 V760 H520 Z" fill="#9e988d"/>
    <path d="M300 168 H520 L596 168" fill="none" stroke="#1c1a17" stroke-width="1.5" opacity="0.55"/>
    <path d="M300 168 V760 M520 168 V760 M596 168 V760" stroke="#1c1a17" stroke-width="1" opacity="0.4"/>
    <!-- deep recessed apertures -->
    <g fill="#2a2620">
      <rect x="344" y="256" width="60" height="180"/>
      <rect x="424" y="256" width="60" height="180"/>
      <rect x="344" y="500" width="140" height="46"/>
      <rect x="344" y="600" width="140" height="46"/>
    </g>

    <!-- mass B: horizontal cantilever -->
    <path d="M660 452 H1180 V620 H660 Z" fill="url(#m-litB)"/>
    <path d="M660 620 H1180 V648 H660 Z" fill="#8e887d"/>
    <path d="M660 452 H1180 V648 H660 Z" fill="none" stroke="#1c1a17" stroke-width="1.5" opacity="0.5"/>
    <g fill="#2a2620" opacity="0.9">
      <rect x="700" y="498" width="420" height="58"/>
    </g>
    <!-- supporting pier -->
    <path d="M760 648 H860 V760 H760 Z" fill="#b8b2a7"/>
    <path d="M760 648 H860 V760 H760 Z" fill="none" stroke="#1c1a17" stroke-width="1" opacity="0.4"/>

    <!-- mass C: low block, cropped by the frame edge -->
    <path d="M1240 560 H1720 V760 H1240 Z" fill="#d3cec4"/>
    <path d="M1240 560 H1720" stroke="#1c1a17" stroke-width="1.5" opacity="0.5"/>
    <path d="M1240 560 V760" stroke="#1c1a17" stroke-width="1" opacity="0.4"/>
    <g fill="#2a2620" opacity="0.85">
      <rect x="1300" y="616" width="46" height="144"/>
      <rect x="1386" y="616" width="46" height="144"/>
      <rect x="1472" y="616" width="46" height="144"/>
    </g>

    <!-- plan hairlines: the only ornament, borrowed from a working drawing -->
    <g stroke="#1c1a17" stroke-width="1" opacity="0.16">
      <path d="M133 0 V1000 M266 0 V1000 M400 0 V1000 M533 0 V1000 M666 0 V1000 M800 0 V1000 M933 0 V1000 M1066 0 V1000 M1200 0 V1000 M1333 0 V1000 M1466 0 V1000"/>
    </g>
    <!-- section datum with leader -->
    <g stroke="#1c1a17" opacity="0.5">
      <path d="M72 452 H660" stroke-width="1" stroke-dasharray="14 8"/>
      <path d="M72 446 V458"/>
    </g>
    <g stroke="#1c1a17" opacity="0.35">
      <path d="M1180 452 H1528" stroke-width="1" stroke-dasharray="14 8"/>
    </g>
  </g>

  <g font-family="ui-monospace, monospace" font-size="14" letter-spacing="3" fill="#16130f" opacity="0.55">
    <text x="86" y="440">DATUM +0.00</text>
    <text x="1196" y="440">SECTION A—A</text>
  </g>
</svg>
